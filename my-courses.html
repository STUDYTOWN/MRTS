<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>My Courses | StudyTown</title>

  <link
    rel="stylesheet"
    href="style.css"
  >


  <style>

    /* ==========================================
       MY COURSES CONTAINER
    ========================================== */

    .my-courses-container {

      max-width: 1000px;

      margin: 0 auto;

      padding: 30px 20px;

    }


    /* ==========================================
       COURSES GRID
    ========================================== */

    .courses-grid {

      display: grid;

      grid-template-columns:
        repeat(
          auto-fit,
          minmax(250px, 1fr)
        );

      gap: 20px;

      margin-top: 30px;

    }


    /* ==========================================
       COURSE CARD
    ========================================== */

    .course-card {

      background: #ffffff;

      border:
        1px solid #e5e5e5;

      border-radius: 15px;

      padding: 25px;

      box-shadow:
        0 5px 20px
        rgba(
          0,
          0,
          0,
          0.06
        );

    }


    .course-card h3 {

      margin-top: 0;

      margin-bottom: 10px;

    }


    /* ==========================================
       COURSE STATUS
    ========================================== */

    .course-status {

      font-size: 14px;

      margin-bottom: 20px;

      opacity: 0.7;

    }


    /* ==========================================
       EMPTY COURSES
    ========================================== */

    .empty-courses {

      text-align: center;

      padding: 60px 20px;

    }


    .empty-courses h3 {

      margin-bottom: 15px;

    }


    /* ==========================================
       BUTTON
    ========================================== */

    .start-course-btn {

      width: 100%;

      cursor: pointer;

      border: none;

    }

  </style>

</head>


<body>


  <main class="section">


    <div class="my-courses-container">


      <!-- ======================================
           PAGE HEADER
      ======================================= -->

      <div class="section-heading">


        <span class="small-title">

          STUDYTOWN

        </span>


        <h2>

          My Courses

        </h2>


        <p>

          Your purchased courses will appear here.

        </p>


      </div>



      <!-- ======================================
           COURSES CONTAINER
      ======================================= -->

      <div
        id="coursesContainer"
        class="courses-grid"
      ></div>



      <!-- ======================================
           EMPTY COURSES MESSAGE
      ======================================= -->

      <div
        id="emptyCourses"
        class="empty-courses"
        style="display:none;"
      >


        <h3>

          No Courses Yet 📚

        </h3>


        <p>

          You have not purchased any courses yet.

        </p>


        <br>


        <a
          href="index.html"
          class="primary-btn"
        >

          Browse Courses →

        </a>


      </div>



      <br>



      <!-- ======================================
           BACK BUTTON
      ======================================= -->

      <div
        style="
          text-align:center;
        "
      >


        <a
          href="index.html"
          class="primary-btn"
        >

          ← Back to StudyTown

        </a>


      </div>


    </div>


  </main>



  <script>


    // ==========================================
    // COURSE ACCESS LINKS
    // ==========================================

    const COURSE_LINKS = {


      // ========================================
      // CLASS 12 HINDI
      // ========================================

      "class12-hindi":
        "class12-hindi.html"


    };



    // ==========================================
    // LOAD PURCHASED COURSES
    // ==========================================

    function loadCourses() {


      // ----------------------------------------
      // PAGE ELEMENTS
      // ----------------------------------------

      const coursesContainer =

        document.getElementById(
          "coursesContainer"
        );


      const emptyCourses =

        document.getElementById(
          "emptyCourses"
        );



      // ----------------------------------------
      // GET PURCHASED COURSES
      // ----------------------------------------

      const purchases =

        JSON.parse(

          localStorage.getItem(
            "studytownPurchases"
          ) || "[]"

        );



      // ----------------------------------------
      // NO PURCHASES
      // ----------------------------------------

      if (

        !purchases ||

        purchases.length === 0

      ) {


        coursesContainer.style.display =
          "none";


        emptyCourses.style.display =
          "block";


        return;

      }



      // ----------------------------------------
      // CLEAR OLD CONTENT
      // ----------------------------------------

      coursesContainer.innerHTML =
        "";



      coursesContainer.style.display =
        "grid";


      emptyCourses.style.display =
        "none";



      // ========================================
      // SHOW PURCHASED COURSES
      // ========================================

      purchases.forEach(
        purchase => {


          // ------------------------------------
          // CREATE COURSE CARD
          // ------------------------------------

          const card =

            document.createElement(
              "div"
            );


          card.className =
            "course-card";



          // ------------------------------------
          // COURSE NAME
          // ------------------------------------

          const courseName =

            purchase.product_name ||

            "StudyTown Course";



          // ------------------------------------
          // PRODUCT ID
          // ------------------------------------

          const productId =

            purchase.product_id;



          // ------------------------------------
          // CREATE CARD CONTENT
          // ------------------------------------

          card.innerHTML = `

            <h3>

              ${courseName}

            </h3>


            <p class="course-status">

              Payment: PAID ✓

            </p>


            <button

              class="
                primary-btn
                start-course-btn
              "

              data-product="${productId}"

            >

              Start Learning →

            </button>

          `;



          // ------------------------------------
          // ADD CARD TO PAGE
          // ------------------------------------

          coursesContainer.appendChild(
            card
          );


        }

      );



      // ========================================
      // START LEARNING BUTTON
      // ========================================

      document

        .querySelectorAll(
          ".start-course-btn"
        )

        .forEach(
          button => {


            button.addEventListener(

              "click",

              () => {


                // ----------------------------
                // GET PRODUCT ID
                // ----------------------------

                const productId =

                  button.dataset.product;



                // ----------------------------
                // GET COURSE URL
                // ----------------------------

                const courseUrl =

                  COURSE_LINKS[
                    productId
                  ];



                // ----------------------------
                // OPEN COURSE
                // ----------------------------

                if (courseUrl) {


                  window.location.href =
                    courseUrl;


                }


                // ----------------------------
                // COURSE LINK NOT FOUND
                // ----------------------------

                else {


                  alert(

                    "Course access link is not available yet."

                  );


                  console.error(

                    "Course link not found for:",

                    productId

                  );


                }


              }

            );


          }

        );


    }



    // ==========================================
    // START
    // ==========================================

    loadCourses();


  </script>


</body>

</html>
