<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>My Courses | StudyTown</title>

  <link
    rel="stylesheet"
    href="style.css"
  >


  <style>

    .my-courses-container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 30px 20px;
    }


    .courses-grid {
      display: grid;

      grid-template-columns:
        repeat(
          auto-fit,
          minmax(250px, 1fr)
        );

      gap: 20px;
      margin-top: 30px;
    }


    .course-card {
      background: #ffffff;
      border: 1px solid #e5e5e5;
      border-radius: 15px;
      padding: 25px;

      box-shadow:
        0 5px 20px
        rgba(0, 0, 0, 0.06);
    }


    .course-card h3 {
      margin-top: 0;
      margin-bottom: 10px;
    }


    .course-status {
      font-size: 14px;
      margin-bottom: 20px;
      opacity: 0.7;
    }


    .empty-courses {
      text-align: center;
      padding: 60px 20px;
    }


    .start-course-btn {
      width: 100%;
      cursor: pointer;
      border: none;
    }

  </style>

</head>


<body>


  <main class="section">

    <div class="my-courses-container">


      <!-- PAGE HEADER -->

      <div class="section-heading">

        <span class="small-title">
          STUDYTOWN
        </span>

        <h2>
          My Courses
        </h2>

        <p>
          Your purchased courses will appear here.
        </p>

      </div>


      <!-- COURSES -->

      <div
        id="coursesContainer"
        class="courses-grid"
      ></div>


      <!-- NO COURSES -->

      <div
        id="emptyCourses"
        class="empty-courses"
        style="display:none;"
      >

        <h3>
          No Courses Yet 📚
        </h3>

        <p>
          You have not purchased any courses yet.
        </p>

        <br>

        <a
          href="index.html"
          class="primary-btn"
        >
          Browse Courses →
        </a>

      </div>


      <br>


      <!-- BACK BUTTON -->

      <div style="text-align:center;">

        <a
          href="index.html"
          class="primary-btn"
        >
          ← Back to StudyTown
        </a>

      </div>


    </div>

  </main>


  <script>


    // ==========================================
    // COURSE ACCESS LINKS
    // ==========================================

    const COURSE_LINKS = {


      // CLASS 12 HINDI

      "class12-hindi":
        "https://studytown.github.io/12hbdf/"


    };



    // ==========================================
    // LOAD PURCHASED COURSES
    // ==========================================

    function loadCourses() {


      const coursesContainer =
        document.getElementById(
          "coursesContainer"
        );


      const emptyCourses =
        document.getElementById(
          "emptyCourses"
        );


      // Get purchases from browser

      const purchases =
        JSON.parse(

          localStorage.getItem(
            "studytownPurchases"
          ) || "[]"

        );


      // No purchased courses

      if (
        !purchases ||
        purchases.length === 0
      ) {

        coursesContainer.style.display =
          "none";

        emptyCourses.style.display =
          "block";

        return;

      }


      // Reset container

      coursesContainer.innerHTML =
        "";

      coursesContainer.style.display =
        "grid";

      emptyCourses.style.display =
        "none";


      // ========================================
      // CREATE COURSE CARDS
      // ========================================

      purchases.forEach(
        purchase => {


          const card =
            document.createElement(
              "div"
            );


          card.className =
            "course-card";


          const courseName =
            purchase.product_name ||
            "StudyTown Course";


          const productId =
            purchase.product_id;


          // Course card content

          card.innerHTML = `

            <h3>
              ${courseName}
            </h3>


            <p class="course-status">
              Payment: PAID ✓
            </p>


            <button
              class="
                primary-btn
                start-course-btn
              "

              data-product="${productId}"
            >
              Start Learning →
            </button>

          `;


          coursesContainer.appendChild(
            card
          );


        }

      );



      // ========================================
      // START LEARNING BUTTON
      // ========================================

      document

        .querySelectorAll(
          ".start-course-btn"
        )

        .forEach(
          button => {


            button.addEventListener(

              "click",

              () => {


                const productId =
                  button.dataset.product;


                const courseUrl =
                  COURSE_LINKS[
                    productId
                  ];


                // Open course page

                if (courseUrl) {

                  window.location.href =
                    courseUrl;

                }

                else {

                  alert(
                    "Course access link is not available yet."
                  );

                  console.error(
                    "Course link not found:",
                    productId
                  );

                }


              }

            );


          }

        );


    }



    // ==========================================
    // START
    // ==========================================

    loadCourses();


  </script>


</body>

</html>
