<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>My Courses | StudyTown</title>

  <link rel="stylesheet" href="style.css">


  <style>

    .my-courses-container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 30px 20px;
    }


    .courses-grid {
      display: grid;
      grid-template-columns:
        repeat(
          auto-fit,
          minmax(250px, 1fr)
        );
      gap: 20px;
      margin-top: 30px;
    }


    .course-card {
      background: #ffffff;
      border: 1px solid #e5e5e5;
      border-radius: 15px;
      padding: 25px;
      box-shadow:
        0 5px 20px
        rgba(0, 0, 0, 0.06);
    }


    .course-card h3 {
      margin-top: 0;
      margin-bottom: 10px;
      color: #193b32;
    }


    .course-status {
      font-size: 14px;
      margin-bottom: 20px;
      opacity: 0.7;
    }


    .empty-courses {
      text-align: center;
      padding: 60px 20px;
    }


    .empty-courses h3 {
      margin-bottom: 15px;
    }


    .loading-courses {
      text-align: center;
      padding: 50px 20px;
    }


    .course-id {
      font-size: 12px;
      opacity: 0.55;
      margin-bottom: 15px;
      word-break: break-word;
    }

  </style>

</head>


<body>


  <main class="section">


    <div class="my-courses-container">


      <!-- ======================================
           PAGE HEADING
      ======================================= -->

      <div class="section-heading">

        <span class="small-title">
          STUDYTOWN
        </span>


        <h2>
          My Courses
        </h2>


        <p>
          Your purchased courses will appear here.
        </p>

      </div>


      <!-- ======================================
           LOADING
      ======================================= -->

      <div
        id="loadingCourses"
        class="loading-courses"
      >

        Loading your courses...

      </div>


      <!-- ======================================
           COURSES CONTAINER
      ======================================= -->

      <div
        id="coursesContainer"
        class="courses-grid"
        style="display:none;"
      ></div>


      <!-- ======================================
           EMPTY COURSES
      ======================================= -->

      <div
        id="emptyCourses"
        class="empty-courses"
        style="display:none;"
      >

        <h3>
          No Courses Yet 📚
        </h3>


        <p>
          You have not purchased any courses yet.
        </p>


        <br>


        <a
          href="index.html"
          class="primary-btn"
        >
          Browse Courses →
        </a>

      </div>


      <!-- ======================================
           BACK BUTTON
      ======================================= -->

      <br>


      <div
        style="
          text-align:center;
        "
      >

        <a
          href="index.html"
          class="primary-btn"
        >
          ← Back to StudyTown
        </a>

      </div>


    </div>


  </main>


  <script>


    // ==========================================
    // DOM ELEMENTS
    // ==========================================

    const coursesContainer =
      document.getElementById(
        "coursesContainer"
      );


    const emptyCourses =
      document.getElementById(
        "emptyCourses"
      );


    const loadingCourses =
      document.getElementById(
        "loadingCourses"
      );



    // ==========================================
    // LOAD PURCHASED COURSES
    // ==========================================

    function loadCourses() {


      // ========================================
      // GET PURCHASES FROM LOCAL STORAGE
      // ========================================

      let purchases = [];


      try {

        purchases =
          JSON.parse(

            localStorage.getItem(
              "studytownPurchases"
            ) || "[]"

          );

      } catch (error) {

        console.error(
          "Unable to load purchases:",
          error
        );

        purchases = [];

      }



      // ========================================
      // HIDE LOADING
      // ========================================

      loadingCourses.style.display =
        "none";



      // ========================================
      // NO PURCHASES
      // ========================================

      if (

        !Array.isArray(
          purchases
        )

        ||

        purchases.length === 0

      ) {


        coursesContainer.style.display =
          "none";


        emptyCourses.style.display =
          "block";


        return;

      }



      // ========================================
      // SHOW COURSES
      // ========================================

      emptyCourses.style.display =
        "none";


      coursesContainer.style.display =
        "grid";


      coursesContainer.innerHTML =
        "";



      // ========================================
      // REMOVE DUPLICATE COURSES
      // ========================================

      const uniqueCourses = [];


      const addedProducts =
        new Set();



      purchases.forEach(
        purchase => {


          if (

            !purchase

            ||

            !purchase.product_id

          ) {

            return;

          }



          // Don't show same course twice

          if (

            addedProducts.has(
              purchase.product_id
            )

          ) {

            return;

          }



          addedProducts.add(
            purchase.product_id
          );


          uniqueCourses.push(
            purchase
          );


        }
      );



      // ========================================
      // DISPLAY COURSES
      // ========================================

      uniqueCourses.forEach(
        purchase => {


          const card =
            document.createElement(
              "div"
            );


          card.className =
            "course-card";



          const courseName =

            purchase.product_name

            ||

            "StudyTown Course";



          const productId =

            purchase.product_id

            ||

            "";



          card.innerHTML = `

            <h3>
              ${escapeHtml(courseName)}
            </h3>


            <p class="course-status">

              Payment:
              <strong>
                PAID ✓
              </strong>

            </p>


            <p class="course-id">

              Course ID:
              ${escapeHtml(productId)}

            </p>


            <button
              class="
                primary-btn
                start-course-btn
              "
              data-product="${escapeAttribute(productId)}"
            >

              Start Learning →

            </button>

          `;



          coursesContainer.appendChild(
            card
          );


        }
      );



      // ========================================
      // START LEARNING BUTTONS
      // ========================================

      document
        .querySelectorAll(
          ".start-course-btn"
        )
        .forEach(
          button => {


            button.addEventListener(
              "click",
              () => {


                const productId =
                  button.dataset.product;


                openCourse(
                  productId
                );


              }
            );


          }
        );


    }



    // ==========================================
    // OPEN COURSE
    // ==========================================

    function openCourse(
      productId
    ) {


      // For now we show the course ID.
      // Later we will connect every product
      // to its actual course page.

      alert(

        "Opening your course: " +
        productId

      );


    }



    // ==========================================
    // SECURITY: ESCAPE HTML
    // ==========================================

    function escapeHtml(
      text
    ) {


      const div =
        document.createElement(
          "div"
        );


      div.textContent =
        text;


      return div.innerHTML;


    }



    // ==========================================
    // SECURITY: ESCAPE ATTRIBUTE
    // ==========================================

    function escapeAttribute(
      text
    ) {


      return String(text)
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        );


    }



    // ==========================================
    // START
    // ==========================================

    loadCourses();


  </script>


</body>

</html>
