<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Payment Status | StudyTown</title>

  <link rel="stylesheet" href="style.css">

</head>


<body>

  <main class="section">

    <div class="section-heading">

      <span class="small-title">
        PAYMENT
      </span>


      <h2 id="statusTitle">
        Verifying Payment...
      </h2>


      <p id="statusMessage">
        Please wait while we securely verify your payment.
      </p>


      <p id="orderId"></p>


      <div id="courseInfo"></div>


      <br>


      <a
        id="continueButton"
        class="primary-btn"
        href="index.html"
        style="display:none;"
      >
        Continue to StudyTown →
      </a>


    </div>

  </main>


  <script>

    // ==========================================
    // StudyTown Payment Worker API
    // ==========================================

    const PAYMENT_API =
      "https://shy-field-cc38studytown-payment.tarunsaini201986.workers.dev";


    // ==========================================
    // Get URL Parameters
    // ==========================================

    const params =
      new URLSearchParams(
        window.location.search
      );


    const orderId =
      params.get("order_id");


    // ==========================================
    // Page Elements
    // ==========================================

    const statusTitle =
      document.getElementById(
        "statusTitle"
      );


    const statusMessage =
      document.getElementById(
        "statusMessage"
      );


    const orderIdElement =
      document.getElementById(
        "orderId"
      );


    const courseInfo =
      document.getElementById(
        "courseInfo"
      );


    const continueButton =
      document.getElementById(
        "continueButton"
      );


    // ==========================================
    // Show Order ID
    // ==========================================

    if (orderId) {

      orderIdElement.textContent =
        "Order ID: " +
        orderId;

    }


    // ==========================================
    // Save Purchased Course
    // ==========================================

    function savePurchasedCourse(data) {

      // Safety check
      if (
        !data ||
        !data.product_id ||
        !data.product_name
      ) {

        console.error(
          "Course information missing:",
          data
        );

        return;

      }


      // Get existing purchases
      const savedPurchases =
        JSON.parse(
          localStorage.getItem(
            "studytownPurchases"
          ) || "[]"
        );


      // Check if this order already exists
      const alreadySaved =
        savedPurchases.some(
          purchase =>
            purchase.order_id === orderId
        );


      // Don't save duplicate
      if (alreadySaved) {

        console.log(
          "Purchase already saved."
        );

        return;

      }


      // Create purchase record
      const purchase = {

        order_id:
          orderId,

        product_id:
          data.product_id,

        product_name:
          data.product_name,

        amount:
          data.amount || null,

        payment_status:
          "PAID",

        purchased_at:
          new Date().toISOString()

      };


      // Save new purchase
      savedPurchases.push(
        purchase
      );


      // Save back to browser
      localStorage.setItem(
        "studytownPurchases",
        JSON.stringify(
          savedPurchases
        )
      );


      console.log(
        "Course saved successfully:",
        purchase
      );

    }


    // ==========================================
    // Verify Payment
    // ==========================================

    async function verifyPayment() {


      // ----------------------------------------
      // No Order ID
      // ----------------------------------------

      if (!orderId) {

        statusTitle.textContent =
          "Payment Verification Failed";


        statusMessage.textContent =
          "Order ID was not found.";


        return;

      }


      try {


        // --------------------------------------
        // Verify Order With Worker
        // --------------------------------------

        const response =
          await fetch(

            PAYMENT_API +
            "/verify-payment?order_id=" +
            encodeURIComponent(
              orderId
            )

          );


        const data =
          await response.json();


        console.log(
          "Payment Verification:",
          data
        );


        // ======================================
        // PAYMENT SUCCESS
        // ======================================

        if (

          response.ok &&

          data.success &&

          data.paid

        ) {


          // Save purchased course locally
          savePurchasedCourse(
            data
          );


          statusTitle.textContent =
            "Payment Successful! 🎉";


          statusMessage.textContent =
            "Your payment has been verified successfully.";


          // Show course name
          if (
            data.product_name
          ) {

            courseInfo.innerHTML =

              "<strong>Course:</strong> " +

              data.product_name;

          }


          // Show continue button
          continueButton.style.display =
            "inline-flex";


          return;

        }


        // ======================================
        // PAYMENT PENDING
        // ======================================

        if (

          response.ok &&

          data.success &&

          !data.paid

        ) {


          statusTitle.textContent =
            "Payment Pending";


          statusMessage.textContent =
            "Your payment has not been confirmed yet. Please wait a moment and refresh this page.";


          return;

        }


        // ======================================
        // PAYMENT ERROR
        // ======================================

        statusTitle.textContent =
          "Payment Verification Failed";


        statusMessage.textContent =

          data.message ||

          "We could not verify your payment.";


      } catch (error) {


        console.error(
          "Verification Error:",
          error
        );


        statusTitle.textContent =
          "Connection Error";


        statusMessage.textContent =
          "Unable to verify your payment. Please refresh the page and try again.";

      }

    }


    // ==========================================
    // Start Payment Verification
    // ==========================================

    verifyPayment();

  </script>

</body>

</html>
