<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Payment Successful | StudyTown</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      min-height: 100vh;
      background: #f5f7fb;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: white;
      border-radius: 20px;
      padding: 45px 30px;
      text-align: center;
      box-shadow: 0 15px 50px rgba(0, 0, 0, 0.08);
    }

    .success-icon {
      width: 85px;
      height: 85px;
      margin: 0 auto 25px;
      border-radius: 50%;
      background: #e8fff0;
      color: #16a34a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 45px;
      font-weight: bold;
    }

    h1 {
      color: #111827;
      font-size: 30px;
      margin-bottom: 15px;
    }

    p {
      color: #6b7280;
      font-size: 16px;
      line-height: 1.6;
    }

    .order-box {
      margin-top: 25px;
      padding: 18px;
      background: #f8fafc;
      border-radius: 12px;
      text-align: left;
    }

    .label {
      font-size: 13px;
      color: #9ca3af;
      margin-bottom: 7px;
    }

    .order-id {
      font-size: 14px;
      color: #111827;
      font-weight: bold;
      word-break: break-all;
    }

    .btn {
      display: block;
      width: 100%;
      margin-top: 30px;
      padding: 15px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-weight: bold;
      transition: 0.2s;
    }

    .btn:hover {
      background: #1d4ed8;
    }

    .small-text {
      margin-top: 20px;
      font-size: 13px;
      color: #9ca3af;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="success-icon">
      ✓
    </div>

    <h1>Payment Successful!</h1>

    <p>
      Thank you for your purchase. Your payment has been completed successfully.
    </p>

    <div class="order-box">
      <div class="label">Order ID</div>
      <div class="order-id" id="orderId">
        Loading...
      </div>
    </div>

    <a href="index.html" class="btn">
      Continue to StudyTown
    </a>

    <div class="small-text">
      If you have any issues with your order, please contact StudyTown support.
    </div>

  </div>

  <script>
    const params = new URLSearchParams(window.location.search);

    const orderId = params.get("order_id");

    document.getElementById("orderId").textContent =
      orderId || "Order ID not available";
  </script>

</body>
</html>
